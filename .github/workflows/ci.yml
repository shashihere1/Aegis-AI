# Continuous integration: the Python suite (including the real-OPA conformance tests), the Rego itself under OPA,
# and the console build.
#
# Runs on Windows because the team develops on Windows and regopy (the in-process Rego engine) publishes Windows
# wheels for Python 3.14. setup-opa installs a real OPA binary, so the tests that need one run here instead of
# being skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-policy:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Rego compiles
        run: opa check config/policies

      - name: Rego unit tests (generated from tests/policy_cases.py)
        run: opa test config/policies -v

      - name: Lint
        run: python -m ruff check .

      - name: Tests (Python, regopy and real OPA engines)
        run: python -m pytest -q

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The lockfile records the Infosys Artifactory mirror (host AND path), which CI runners cannot reach. Point every
      # resolved URL at the public registry; the integrity hashes are unchanged because the tarballs are identical.
      - name: Install
        working-directory: web
        run: |
          sed -i 's#https://infyartifactory.jfrog.io/artifactory/api/npm/npm-remote/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --registry=https://registry.npmjs.org/

      - name: Typecheck and build
        working-directory: web
        run: npm run build
