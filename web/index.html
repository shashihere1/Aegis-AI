<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <title>Aegis · Agent security console</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("aegis.theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
